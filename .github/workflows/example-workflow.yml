# EXAMPLE WORKFLOW
name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry_run: 
        description: "Make no changes"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deployment
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: publish-site
        uses: ./
        with:
          dry_run: ${{ inputs.dry_run }}
          url: https://127.0.0.1
